[project]
name = "mingping"
version = "0.1.3"
description = "Fast async multi-ping network scanner with a live terminal UI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Eli Frigo", email = "eli@elifrigo.com" }]
keywords = ["network", "scanner", "ping", "cli", "icmp", "tcp", "udp"]
classifiers = [
    "Environment :: Console",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.3.1",
    "icmplib>=3.0.4",
    "rich>=14.3.3",
]

[project.urls]
Homepage = "https://github.com/EliTheCoder/ming"
Repository = "https://github.com/EliTheCoder/ming"
Issues = "https://github.com/EliTheCoder/ming/issues"

[project.scripts]
ming = "ming.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ming"]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "ty>=0.0.23",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
    "RUF001", # × and — are intentional display characters
    "B023",   # closures in scan loop are consumed within the same iteration
]
