name: Release

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: ming-linux-x86_64
          - os: macos-latest
            asset_name: ming-macos-arm64
          - os: windows-latest
            asset_name: ming-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build binary
        run: uv run pyinstaller --onefile --name ming --collect-all icmplib ming/cli.py

      - name: Rename artifact
        shell: bash
        run: |
          mv dist/ming${{ matrix.os == 'windows-latest' && '.exe' || '' }} dist/${{ matrix.asset_name }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish-winget:
    name: Publish to winget
    runs-on: windows-latest
    needs: build-binaries
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: EliTheCoder.Ming
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: EliTheCoder

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - run: uv publish
